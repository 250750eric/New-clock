<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ENV-TERMINAL-X (Stable AQI)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050f05; color: #00ff41; font-family: 'Share Tech Mono', monospace; min-height: 100vh; overflow: hidden; position: relative; }
  
  /* 視覺特效：CRT 掃描線與暗角 */
  body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,65,0.03) 2px, rgba(0,255,65,0.03) 4px); pointer-events: none; z-index: 1000; }
  body::after { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.8) 100%); pointer-events: none; z-index: 999; }
  
  #terminal { width: 100%; min-height: 100vh; padding: 16px; display: grid; grid-template-rows: auto 1fr auto; gap: 8px; position: relative; z-index: 10; }

  /* 頂部 Header */
  #header { display: flex; justify-content: space-between; border-bottom: 1px solid #00aa2a; padding-bottom: 6px; font-size: 10px; color: #00aa2a; letter-spacing: 1px; }
  #sys-id { color: #00ff41; }

  /* 時鐘區 */
  #clock-section { display: flex; flex-direction: column; align-items: center; padding: 10px 0; }
  #time-display { font-family: 'VT323', monospace; font-size: clamp(70px, 18vw, 140px); color: #00ff41; text-shadow: 0 0 15px #00ff41; line-height: 0.9; }
  #date-display { font-size: 14px; color: #00cc33; letter-spacing: 2px; margin-top: 8px; }
  #lunar-display { font-size: 12px; color: #00aa2a; margin-top: 4px; letter-spacing: 1px; }

  /* 跑馬燈：橘色 */
  #ticker-wrap { background: rgba(255,140,0,0.05); border: 1px solid #7a3a00; margin: 8px 0; height: 26px; display: flex; align-items: center; overflow: hidden; }
  #ticker { white-space: nowrap; font-size: 11px; color: #ff8c00; animation: scroll-ticker 25s linear infinite; }
  @keyframes scroll-ticker { 0%{transform:translateX(100%)} 100%{transform:translateX(-100%)} }

  /* 數據面板：橘色風格 */
  #data-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .panel { border: 1px solid #7a3a00; padding: 10px; background: rgba(20,10,0,0.4); position: relative; transition: all 0.3s; }
  .panel.api-error { border-color: #ff0000; background: rgba(255,0,0,0.1); }
  .p-label { font-size: 9px; color: #7a3a00; margin-bottom: 6px; font-weight: bold; }
  .p-value { font-family: 'VT323', monospace; font-size: 36px; color: #ff8c00; text-shadow: 0 0 8px #ff8c00; }
  .p-unit { font-size: 10px; color: #7a3a00; margin-left: 4px; }
  .progress-bg { height: 4px; background: #221100; margin-top: 8px; }
  .progress-fill { height: 100%; background: #ff8c00; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 8px #ff8c00; }

  /* 底部狀態列 */
  #status-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; border-top: 1px solid #004411; padding-top: 10px; }
  .status-box { font-size: 11px; color: #00aa2a; background: rgba(0,20,0,0.3); padding: 6px; border: 1px solid #002205; }
  .tag { font-size: 8px; background: #004411; color: #00ff41; padding: 1px 4px; margin-right: 5px; border-radius: 2px; }
  
  .cmd-btn { background: none; border: 1px solid #008822; color: #008822; font-family: 'Share Tech Mono'; font-size: 9px; padding: 4px 8px; cursor: pointer; margin: 2px; transition: 0.2s; }
  .cmd-btn:hover, .cmd-btn.active { background: #00ff41; color: #050f05; box-shadow: 0 0 10px #00ff41; }

  @media (max-width: 650px) { #data-grid { grid-template-columns: repeat(2, 1fr); } #status-bar { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;opacity:0.12;"></canvas>

<div id="terminal">
  <div id="header">
    <div id="sys-id">[ENV-MONITOR V4.5-STABLE]</div>
    <div>LOC: <span id="loc-val">24.16°N 120.68°E (TAICHUNG)</span></div>
    <div>UPTIME: <span id="uptime-val">00:00:00</span></div>
  </div>

  <div id="main-content">
    <div id="clock-section">
      <div id="time-display">00:00:00</div>
      <div id="date-display">---- -- -- [---]</div>
      <div id="lunar-display">載入中...</div>
    </div>

    <div id="ticker-wrap"><div id="ticker">// 系統啟動中 // 正在同步 Open-Meteo 免金鑰 API 數據 //</div></div>

    <div id="data-grid">
      <div class="panel" id="panel-temp">
        <div class="p-label">◈ TEMPERATURE</div>
        <div><span class="p-value" id="val-temp">--</span><span class="p-unit">°C</span></div>
        <div class="progress-bg"><div class="progress-fill" id="bar-temp" style="width: 0%"></div></div>
      </div>
      <div class="panel" id="panel-humid">
        <div class="p-label">◈ HUMIDITY</div>
        <div><span class="p-value" id="val-humid">--</span><span class="p-unit">%RH</span></div>
        <div class="progress-bg"><div class="progress-fill" id="bar-humid" style="width: 0%"></div></div>
      </div>
      <div class="panel" id="panel-aqi">
        <div class="p-label">◈ AIR QUALITY (US-AQI)</div>
        <div><span class="p-value" id="val-aqi">--</span><span class="p-unit">AQI</span></div>
        <div class="progress-bg"><div class="progress-fill" id="bar-aqi" style="width: 0%"></div></div>
      </div>
      <div class="panel" id="panel-wind">
        <div class="p-label">◈ WIND SPEED</div>
        <div><span class="p-value" id="val-wind">--</span><span class="p-unit">km/h</span></div>
        <div class="progress-bg"><div class="progress-fill" id="bar-wind" style="width: 0%"></div></div>
      </div>
    </div>
  </div>

  <div id="status-bar">
    <div class="status-box">
      <div><span class="tag">TTS</span><span id="tts-msg">SYSTEM READY</span></div>
      <div style="margin-top:5px;"><button class="cmd-btn" onclick="manualRefresh()">FORCE_SYNC</button></div>
    </div>
    <div class="status-box">
      <div class="tag">AMBIENT</div>
      <button class="cmd-btn" id="btn-rain" onclick="toggleAmb('rain')">RAIN</button>
      <button class="cmd-btn" id="btn-white" onclick="toggleAmb('white')">WHITE</button>
    </div>
    <div class="status-box">
      <div class="tag">STATION</div>
      <span id="st-msg">TAICHUNG_STATION</span>
    </div>
  </div>
</div>

<script>
/** 核心配置 **/
const LAT = 24.16, LON = 120.68; // 台中座標
let state = { start: Date.now(), weather: null, aqi: null, amb: {} };
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

/** 背景 Matrix 動畫 **/
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let drops = [];
function initMatrix() {
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  drops = Array(Math.floor(canvas.width / 20)).fill(1);
}
function drawMatrix() {
  ctx.fillStyle = 'rgba(5, 15, 5, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#00ff41'; ctx.font = '15px monospace';
  for(let i=0; i<drops.length; i++) {
    const text = String.fromCharCode(0x30A0 + Math.random() * 96);
    ctx.fillText(text, i*20, drops[i]*20);
    if(drops[i]*20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
  requestAnimationFrame(drawMatrix);
}

/** 農曆計算 (簡易邏輯) **/
function updateLunar() {
  const now = new Date();
  // 此處僅為示意展示，實際可接更複雜的農曆庫
  const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
  document.getElementById('date-display').textContent = now.toLocaleDateString('zh-TW', options);
  document.getElementById('lunar-display').textContent = "農曆 丙午馬年 三月十二"; // 依截圖鎖定示意
}

/** 數據抓取：天氣與空氣品質 (全面更換為 Open-Meteo) **/
async function fetchAll() {
  try {
    // 1. 抓取天氣數據
    const resW = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code`);
    const dw = await resW.json();
    const curW = dw.current;

    document.getElementById('val-temp').textContent = Math.round(curW.temperature_2m);
    document.getElementById('bar-temp').style.width = Math.min(100, (curW.temperature_2m + 10) * 2) + '%';
    document.getElementById('val-humid').textContent = curW.relative_humidity_2m;
    document.getElementById('bar-humid').style.width = curW.relative_humidity_2m + '%';
    document.getElementById('val-wind').textContent = Math.round(curW.wind_speed_10m);
    document.getElementById('bar-wind').style.width = Math.min(100, curW.wind_speed_10m * 5) + '%';

    // 2. 抓取空氣品質 (Open-Meteo 版，徹底修復 ERR)
    const resA = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=us_aqi,pm2_5`);
    const da = await resA.json();
    const curA = da.current;
    const aqiVal = Math.round(curA.us_aqi);

    document.getElementById('panel-aqi').classList.remove('api-error');
    document.getElementById('val-aqi').textContent = aqiVal;
    document.getElementById('bar-aqi').style.width = Math.min(100, aqiVal / 2) + '%';
    
    // 更新跑馬燈文字
    const msg = `氣溫 ${curW.temperature_2m}°C // 濕度 ${curW.relative_humidity_2m}% // AQI ${aqiVal} // 狀態: 數據同步成功`;
    document.getElementById('ticker').textContent = `// ${msg} // ${new Date().toLocaleTimeString()} //`;

  } catch(e) {
    console.error("Fetch Error:", e);
    document.querySelectorAll('.panel').forEach(p => p.classList.add('api-error'));
    document.getElementById('ticker').textContent = "// 警告：API 連線異常，請檢查網路狀態 //";
  }
}

/** 系統 Uptime 與時鐘 **/
function updateSys() {
  const up = Math.floor((Date.now() - state.start)/1000);
  const h = Math.floor(up/3600).toString().padStart(2,'0');
  const m = Math.floor((up%3600)/60).toString().padStart(2,'0');
  const s = (up%60).toString().padStart(2,'0');
  document.getElementById('uptime-val').textContent = `${h}:${m}:${s}`;
  
  const now = new Date();
  document.getElementById('time-display').textContent = now.toTimeString().split(' ')[0];
}

/** TTS 語音 **/
function speak(msg) {
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(msg);
  u.lang = 'zh-TW'; u.rate = 0.9;
  document.getElementById('tts-msg').textContent = msg;
  window.speechSynthesis.speak(u);
}

/** 初始化 **/
window.onload = () => {
  initMatrix();
  drawMatrix();
  fetchAll();
  updateLunar();
  setInterval(updateSys, 1000);
  setInterval(fetchAll, 300000); // 每 5 分鐘自動刷新
  
  // 每整點報時
  setInterval(() => {
    const n = new Date();
    if(n.getMinutes() === 0 && n.getSeconds() === 0) 
      speak(`現在時間${n.getHours()}點整，環境監測數據已完成同步。`);
  }, 1000);
};

function manualRefresh() { speak("正在強制同步數據"); fetchAll(); }

/** 環境音效邏輯 **/
function toggleAmb(type) {
  if(state.amb[type]) {
    state.amb[type].stop(); delete state.amb[type];
    document.getElementById('btn-'+type).classList.remove('active');
    return;
  }
  const bufferSize = 2 * audioCtx.sampleRate,
        buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate),
        output = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
  const source = audioCtx.createBufferSource();
  source.buffer = buffer; source.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = type === 'rain' ? 'lowpass' : 'bandpass';
  filter.frequency.value = type === 'rain' ? 800 : 400;
  source.connect(filter); filter.connect(audioCtx.destination);
  source.start(); state.amb[type] = source;
  document.getElementById('btn-'+type).classList.add('active');
}
window.onresize = initMatrix;
</script>
</body>
</html>
